<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Live</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --panel: #1b263b;
      --text: #e0e1dd;
      --muted: #9aa6b2;
      --accent: #00b4d8;
      --good: #52b788;
      --warn: #f4a261;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(160deg, var(--bg), #14213d);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .panel {
      background: rgba(27, 38, 59, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .status {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 600;
      background: rgba(244, 162, 97, 0.2);
      color: var(--warn);
    }

    .status.connected {
      background: rgba(82, 183, 136, 0.2);
      color: var(--good);
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(13, 27, 42, 0.85);
      padding: 16px;
      border-radius: 12px;
      max-height: 420px;
      overflow: auto;
    }

    ul {
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>Dashboard Robot Live</h1>
      <p>Visualisation minimale du flux WebSocket robot -> site.</p>
      <p>
        Etat connexion :
        <span id="connection-status" class="status">deconnecte</span>
      </p>
      <p id="server-url"></p>
    </section>

    <section class="panel">
      <h2>Dernier evenement</h2>
      <pre id="last-event">Aucun evenement recu.</pre>
    </section>

    <section class="panel">
      <h2>Journal live</h2>
      <ul id="event-log"></ul>
    </section>
  </main>

  <script>
    const wsUrl = new URLSearchParams(window.location.search).get("ws") || "ws://localhost:8765";
    const statusEl = document.getElementById("connection-status");
    const urlEl = document.getElementById("server-url");
    const lastEventEl = document.getElementById("last-event");
    const logEl = document.getElementById("event-log");

    urlEl.textContent = `Serveur WebSocket: ${wsUrl}`;

    function appendLog(message) {
      const item = document.createElement("li");
      item.textContent = message;
      logEl.prepend(item);
    }

    function connect() {
      const socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        statusEl.textContent = "connecte";
        statusEl.classList.add("connected");
        socket.send(JSON.stringify({ type: "identify", client_type: "dashboard" }));
        appendLog("Dashboard connecte au serveur WebSocket");
      });

      socket.addEventListener("message", (event) => {
        lastEventEl.textContent = event.data;
        appendLog(`Evenement recu: ${event.data}`);
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "deconnecte";
        statusEl.classList.remove("connected");
        appendLog("Connexion fermee, nouvelle tentative dans 2s");
        setTimeout(connect, 2000);
      });

      socket.addEventListener("error", () => {
        appendLog("Erreur WebSocket");
      });
    }

    connect();
  </script>
</body>
</html>
