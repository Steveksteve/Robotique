name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/integration/requirements-test.txt

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and start services
        run: docker compose -f docker-compose.test.yml up --build -d

      - name: Scan API image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.39.0 image \
            --scanners vuln \
            --format json \
            --output /workspace/trivy-api.json \
            robotique-main-api:latest

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-api.json
          if-no-files-found: ignore

      - name: Fail on CRITICAL or HIGH Trivy findings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys

          path = "trivy-api.json"

          try:
              with open(path, encoding="utf-8") as file:
                  data = json.load(file)
          except FileNotFoundError:
              print("No Trivy report found")
              sys.exit(1)
          except json.JSONDecodeError:
              print("Trivy report is empty or invalid")
              sys.exit(1)

          high = 0
          critical = 0

          for result in data.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  severity = vuln.get("Severity")
                  if severity == "HIGH":
                      high += 1
                  elif severity == "CRITICAL":
                      critical += 1

          if critical:
                print(f"Trivy found CRITICAL={critical} HIGH={high}")
                sys.exit(1)

          if high:
              print(f"Warning: Trivy found HIGH={high} vulnerabilities")

              print("No CRITICAL/HIGH vulnerabilities found by Trivy")

          print("No CRITICAL/HIGH vulnerabilities found by Trivy")
          PY

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:8000/ >/dev/null; then
              echo "API available"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become available"
          exit 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/integration/requirements-test.txt

      - name: Run integration tests
        run: |
          mkdir -p reports
          python -m pytest tests/integration/ -q --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

      - name: Collect docker logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color > ci-docker-logs.txt || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-docker-logs.txt
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
