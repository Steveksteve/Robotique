name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Lint PHP files
        run: |
          find apps/server -name '*.php' -print0 | xargs -0 -n1 php -l

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  robot-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile robot Python sources
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path

          errors = []
          for path in Path('apps/robot/src').rglob('*.py'):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print('Robot Python syntax OK')
          PY

      - name: Validate ROS package manifests are present
        run: |
          test -f apps/robot/src/m3pro_teacher_nav/package.xml
          test -f apps/robot/src/m3pro_teacher_vision/package.xml
          test -f apps/robot/src/m3pro_teacher_demos/package.xml
          test -f apps/robot/src/m3pro_teacher_interfaces/package.xml

  integration-tests:
    runs-on: ubuntu-latest
    needs: [php-syntax, web-build, robot-static-checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/integration/requirements-test.txt

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build and start full stack
        run: docker compose -f docker-compose.test.yml up --build -d

      - name: Wait for API
        shell: bash
        run: |
          for i in {1..90}; do
            if curl -sSf http://localhost:8000/health >/dev/null; then
              echo "API available"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs --no-color api || true
          exit 1

      - name: Wait for web
        shell: bash
        run: |
          for i in {1..90}; do
            if curl -sSf http://localhost:8080/ >/dev/null; then
              echo "Web available"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs --no-color web || true
          exit 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/integration/requirements-test.txt

      - name: Run integration tests
        env:
          API_BASE: http://localhost:8000
          WS_URL: ws://localhost:8765
          WEB_BASE: http://localhost:8080
        run: |
          mkdir -p reports
          python -m pytest tests/integration/ -q --junitxml=reports/junit.xml

      - name: Scan runtime images with Trivy (warning only)
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.57.1 image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output /workspace/trivy-full-stack.json \
            robotique-main-api:latest || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            reports/
            trivy-full-stack.json
          if-no-files-found: ignore

      - name: Collect docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color > ci-docker-logs.txt || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-docker-logs.txt
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
